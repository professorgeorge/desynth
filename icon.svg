<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#161F36" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="125" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Background aura circle -->
  <circle cx="256" cy="256" r="140" fill="url(#penGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Pen nib shape -->
  <g transform="translate(256,230) rotate(-45) translate(-140,-140)">
    <!-- Pen body & nib -->
    <path d="M140 30 L220 110 L190 200 L140 250 L90 200 L60 110 Z" fill="url(#penGrad)" filter="url(#glow)" />
    <!-- Nib tip slice -->
    <path d="M140 250 L140 160" stroke="#0B0F19" stroke-width="8" stroke-linecap="round" />
    <circle cx="140" cy="155" r="8" fill="#0B0F19" />
    <!-- Decorative shield bevel -->
    <path d="M140 45 L200 105 L175 180 L140 215 L105 180 L80 105 Z" fill="rgba(255,255,255,0.15)" />
  </g>

  <!-- Organic ink wave cut below nib -->
  <path d="M120 370 C 180 340, 220 400, 280 370 C 330 345, 360 375, 400 360" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="400" cy="360" r="7" fill="#10B981" />
</svg>
